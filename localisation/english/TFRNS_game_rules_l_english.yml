 TFRNS_CHA_Sahel_Side: "@CHA Chad - Sahel War Alignment"
 TFRNS_CHA_Sahel_Side_DEFAULT_DESC: "Default TFR behaviour. Chad only enters the Sahel War if the USSR takes the 'Influence Chadian Elections' decision before 6 May 2024. Otherwise it stays neutral."
 TFRNS_CHA_Sahel_Side_SOV_TXT: "§RJoin the Sahel Pact§!"
 TFRNS_CHA_Sahel_Side_SOV_TXT_DESC: "@SOVPro-Russian. Applies the Soviet 'Influence Chadian Elections' pressure. When the Sahel War begins, Chad declares war on Nigeria and joins the Mali-led West African Security Pact.\n\n§gThis uses TFR's own pressure logic, so it also forces Chad's 2024 election to the pro-Sahel PSF.§!"
 TFRNS_CHA_Sahel_Side_NEUTRAL_TXT: "§gStay Neutral§!"
 TFRNS_CHA_Sahel_Side_NEUTRAL_TXT_DESC: "Removes the Soviet pressure. Chad stays out of the Sahel War and never joins the Mali-led West African Security Pact."

 TFRNS_MRT_Sahel_Side: "@MRT Mauritania - Sahel War Alignment"
 TFRNS_MRT_Sahel_Side_DEFAULT_DESC: "Default TFR behaviour. Mauritania only enters the Sahel War if France takes the 'Pressure Mauritania' decision. Otherwise it stays neutral."
 TFRNS_MRT_Sahel_Side_FRA_TXT: "§BJoin ECOMOG§!"
 TFRNS_MRT_Sahel_Side_FRA_TXT_DESC: "@FRAPro-French. Applies the French 'Pressure Mauritania' pressure. When the Sahel War begins, Mauritania declares war on Mali and joins the Ivory Coast-led ECOMOG.\n\n§YIf Mauritania is already a subject, this rule leaves TFR's existing pressure state alone and lets vanilla decide.§!"
 TFRNS_MRT_Sahel_Side_NEUTRAL_TXT: "§gStay Neutral§!"
 TFRNS_MRT_Sahel_Side_NEUTRAL_TXT_DESC: "Removes the French pressure. Mauritania stays out of the Sahel War and never joins the Ivory Coast-led ECOMOG."

 TFRNS_Sahel_War_Winner: "Sahel War Winner"
 TFRNS_Sahel_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The Sahel War plays out as normal; this rule grants no Mushroom Army buff."
 TFRNS_Sahel_War_Winner_ECOMOG_TXT: "§BECOMOG§!"
 TFRNS_Sahel_War_Winner_ECOMOG_DESC: "@IVO Favours the Ivory Coast-led ECOMOG. @IVO Ivory Coast and every nation in its faction receive the §YMushroom Army§! attack buff while the Sahel War is fought.\n\n§gMembership is checked dynamically: nations that join or leave the faction during the war gain or lose the buff accordingly.§!"
 TFRNS_Sahel_War_Winner_SAHEL_TXT: "§OSahel Security Pact§!"
 TFRNS_Sahel_War_Winner_SAHEL_DESC: "@MLI Favours the Mali-led Sahel Security Pact. @MLI Mali and every nation in its faction receive the §YMushroom Army§! attack buff while the Sahel War is fought.\n\n§gMembership is checked dynamically: nations that join or leave the faction during the war gain or lose the buff accordingly.§!"

 TFRNS_British_Civil_War_Winner: "British Civil War Winner"
 TFRNS_British_Civil_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The British Civil War plays out as normal."
 TFRNS_British_Civil_War_Winner_ENG_TXT: "§YUnited Kingdom§!"
 TFRNS_British_Civil_War_Winner_ENG_DESC: "@ENG Favours the §YUnited Kingdom§! against the British Revolution and Scotland. The United Kingdom receives the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while at least two of §YENG§!, §YUK2§! and §YSCO§! exist and are at war.§!"
 TFRNS_British_Civil_War_Winner_UK2_TXT: "§YBritish Revolution§!"
 TFRNS_British_Civil_War_Winner_UK2_DESC: "@UK2 Favours the §YBritish Revolution§! (UK2) against the United Kingdom and Scotland. The British Revolution receives the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while at least two of §YENG§!, §YUK2§! and §YSCO§! exist and are at war.§!"
 TFRNS_British_Civil_War_Winner_SCO_TXT: "§YScotland§!"
 TFRNS_British_Civil_War_Winner_SCO_DESC: "@SCO Favours §YScotland§! against the United Kingdom and the British Revolution. Scotland receives the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while at least two of §YENG§!, §YUK2§! and §YSCO§! exist and are at war.§!"

 TFRNS_Troubles_Winner: "Second Troubles Winner"
 TFRNS_Troubles_Winner_DEFAULT_DESC: "Default TFR behaviour. The Second Troubles play out as normal."
 TFRNS_Troubles_Winner_NIR_TXT: "§YNorthern Ireland§!"
 TFRNS_Troubles_Winner_NIR_DESC: "@NIR Favours §YNorthern Ireland§! against the IRA. Northern Ireland receives the §YMushroom Army§! attack buff for as long as it is at war with the §YIrish Republican Army§!."
 TFRNS_Troubles_Winner_IRA_TXT: "§YIrish Republican Army§!"
 TFRNS_Troubles_Winner_IRA_DESC: "@IRA Favours the §YIrish Republican Army§! (IRA) against Northern Ireland. The IRA receives the §YMushroom Army§! attack buff for as long as it is at war with §YNorthern Ireland§!."
 TFRNS_Troubles_Winner_IRE_TXT: "§YIreland§!"
 TFRNS_Troubles_Winner_IRE_DESC: "@IRE Favours §YIreland§! in the IRA's follow-up war. The IRA receives the §YMushroom Army§! attack buff while it fights the Ulster Coalition; once it wins, the buff is stripped from the IRA and handed to Ireland for the war against the IRA.\n\n§gThe war only happens if the IRA wins against the Ulster Coalition (Northern Ireland) first.§!"

 TFRNS_Spanish_Civil_War_Winner: "Second Spanish Civil War Winner"
 TFRNS_Spanish_Civil_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The Second Spanish Civil War plays out as normal."
 TFRNS_Spanish_Civil_War_Winner_SPR_TXT: "§YKingdom of Spain§!"
 TFRNS_Spanish_Civil_War_Winner_SPR_DESC: "@SPR Favours the §YKingdom of Spain§! against the Spanish National State and the Republican side (Republican Spain, Catalonia and the Basque Country). The Kingdom of Spain receives the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while §YSPR§!, §YRSR§! and §YSNS§! exist and are at war.§!"
 TFRNS_Spanish_Civil_War_Winner_RSR_TXT: "§YRepublican Spain§!"
 TFRNS_Spanish_Civil_War_Winner_RSR_DESC: "@RSR Favours the §YRepublican side§! - Republican Spain, Catalonia and the Basque Country - against the Spanish National State and the Kingdom of Spain. All three Republican countries receive the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while §YSPR§!, §YRSR§! and §YSNS§! exist and are at war.§!"
 TFRNS_Spanish_Civil_War_Winner_SNS_TXT: "§YSpanish National State§!"
 TFRNS_Spanish_Civil_War_Winner_SNS_DESC: "@SNS Favours the §YSpanish National State§! against the Kingdom of Spain and the Republican side (Republican Spain, Catalonia and the Basque Country). The Spanish National State receives the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while §YSPR§!, §YRSR§! and §YSNS§! exist and are at war.§!"

 TFRNS_Portuguese_Civil_War_Winner: "Portuguese Civil War Winner"
 TFRNS_Portuguese_Civil_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The Portuguese Civil War plays out as normal."
 TFRNS_Portuguese_Civil_War_Winner_POR_TXT: "§YPortuguese Republic§!"
 TFRNS_Portuguese_Civil_War_Winner_POR_DESC: "@POR Favours the §YPortuguese Republic§! against the People's Republic of Portugal and Regnum Caelorum in Terra. The Portuguese Republic receives the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while two of §YPOR§!, §YPRP§! and §YGOD§! exist and are at war.§!"
 TFRNS_Portuguese_Civil_War_Winner_PRP_TXT: "§YPeople's Republic of Portugal§!"
 TFRNS_Portuguese_Civil_War_Winner_PRP_DESC: "@PRP Favours the §YPeople's Republic of Portugal§! against the Portuguese Republic and Regnum Caelorum in Terra. The People's Republic receives the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while two of §YPOR§!, §YPRP§! and §YGOD§! exist and are at war.§!"
 TFRNS_Portuguese_Civil_War_Winner_GOD_TXT: "§YRegnum Caelorum in Terra§!"
 TFRNS_Portuguese_Civil_War_Winner_GOD_DESC: "@GOD Favours §YRegnum Caelorum in Terra§! against the Portuguese Republic and the People's Republic of Portugal. The Kingdom of Heaven on Earth receives the §YMushroom Army§! attack buff for as long as the civil war is fought.\n\n§gThe rule only applies while two of §YPOR§!, §YPRP§! and §YGOD§! exist and are at war.§!"

 TFRNS_Corsican_Riots: "Corsican Riots Escalation"
 TFRNS_Corsican_Riots_DEFAULT_DESC: "Default TFR behaviour. Every time the Corsican riots event fires there is a 1% chance that France escalates the unrest into an annexation war against Corsica."
 TFRNS_Corsican_Riots_ALWAYS_TXT: "Always Escalate"
 TFRNS_Corsican_Riots_ALWAYS_DESC: "The Corsican riots always escalate. The first time the riots event fires, France declares an annexation war on Corsica."
 TFRNS_Corsican_Riots_NEVER_TXT: "Never Escalate"
 TFRNS_Corsican_Riots_NEVER_DESC: "The Corsican riots never escalate into war. The unrest continues until France reintegrates the island through its normal focus or decision."

 TFRNS_Xinjiang_Insurgency: "Xinjiang Insurgency"
 TFRNS_Xinjiang_Insurgency_DEFAULT_DESC: "Default TFR behaviour. The Xinjiang Insurgency plays out as normal.\n\n§gChina must lose the Taiwan war for the uprising to break out at all - that defeat is what triggers the collapse of order in Xinjiang.§!"
 TFRNS_Xinjiang_Insurgency_CRUSHED_TXT: "§YUprising Crushed§!"
 TFRNS_Xinjiang_Insurgency_CRUSHED_DESC: "@XIN Favours the §YXinjiang Production and Construction Corps§! against the East Turkestan rebels. The Construction Corps receives the §YMushroom Army§! attack buff for as long as the insurgency is fought.\n\n§gChina must lose the Taiwan war for the uprising to break out at all. The rule only applies while §YXIN§! still exists and is at war with at least one of §YSIK§!, §YHUT§! and §YETL§!.§!"
 TFRNS_Xinjiang_Insurgency_UNCONTROLLED_TXT: "§YNorthwest Out of Control§!"
 TFRNS_Xinjiang_Insurgency_UNCONTROLLED_DESC: "@SIK Favours the §YEast Turkestan rebels§! (SIK, HUT and ETL) against the Xinjiang Production and Construction Corps. Every rebel tag receives the §YMushroom Army§! attack buff for as long as the insurgency is fought.\n\n§gChina must lose the Taiwan war for the uprising to break out at all. The rule only applies while §YXIN§! still exists and is at war with at least one of §YSIK§!, §YHUT§! and §YETL§!.§!"

