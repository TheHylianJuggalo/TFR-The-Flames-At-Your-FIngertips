 TFRNS_GNA_Sahel_Side: "@GNA Guinea - Sahel War Alignment"
 TFRNS_GNA_Sahel_Side_DEFAULT_DESC: "Default TFR behaviour. Guinea picks its own side in the Sahel War: it joins the West African Security Pact if nationalism dominates, or ECOMOG if market liberalism does. Otherwise it stays neutral."
 TFRNS_GNA_Sahel_Side_SOV_TXT: "§aNCRD§!"
 TFRNS_GNA_Sahel_Side_SOV_TXT_DESC: "@SOVPro-Russian. The ideology is Military Junta.\n\nForces Guinea onto the pro-Russian side: it joins the Mali-led West African Security Pact once Mali forms it, and any French influence is removed.\n\n§gThe ruling party is not changed - only the war alignment is forced.§!"
 TFRNS_GNA_Sahel_Side_FRA_TXT: "§sRPG§!"
 TFRNS_GNA_Sahel_Side_FRA_TXT_DESC: "@FRAPro-French. The ideology is Social Democracy.\n\nForces Guinea onto the pro-French side: it joins the Ivory Coast-led ECOMOG faction once Ivory Coast forms it, and any Russian influence is removed.\n\n§gThe ruling party is not changed - only the war alignment is forced.§!"

