l_english:
 TFRNS_Total_War: "Total War"
 TFRNS_Total_War_OFF_TXT: "§GTotal War Disabled§!"
 TFRNS_Total_War_OFF_DESC: "The §YThe Fire Does Not Yield§! national spirit is not applied, so nations surrender normally.\n\n§gDefault. The mod has no effect while this is selected.§!"
 TFRNS_Total_War_ON_TXT: "§RTotal War Enabled§!"
 TFRNS_Total_War_ON_DESC: "Every nation receives the §YThe Fire Does Not Yield§! national spirit, raising its surrender limit to 100%. No nation capitulates until its entire territory is occupied.\n\n§RWarning:§! This can drag wars out and may prevent scripted war endings - stalemates and rule-forced outcomes - from triggering in time."

 The_IAI_Terrorism_QUASHED_TXT: "@MLI @VOL @NGR @IVO Terrorism Quashed"
 The_IAI_Terrorism_QUASHED_TXT_DESC: "The Mali-led coalition defeats Wilayat Sahil and the Azawad Coordination Movement. All four coalition governments - @MLI Mali, @VOL Burkina Faso, @NGR Niger and @IVO Cote d'Ivoire - receive the Mushroom Army war buff for the duration of the rebellion.\n\nThis single option replaces the former Mali, Burkina Faso, Niger and Cote d'Ivoire options."

 TFRNS_Tunisia_2020_crisis: "The Tunisian Crisis"
 TFRNS_Tunisia_2020_crisis_DEFAULT_DESC: "The AI decides the crisis on its own - even odds of the vote succeeding or failing."
 TFRNS_Tunisia_2020_crisis_1_TXT: "Democracy Prevails"
 TFRNS_Tunisia_2020_crisis_1_TXT_DESC: "The no-confidence vote succeeds and new elections are held.\n\nThe §YTunisian Elections§! rule decides the result - this is the only crisis outcome where that rule takes effect."
 TFRNS_Tunisia_2020_crisis_2_TXT: "Democracy Dies in Darkness"
 TFRNS_Tunisia_2020_crisis_2_TXT_DESC: "The government falls and President Kais Saied consolidates power.\n\n§RNo elections are held§!, so the §YTunisian Elections§! rule has no effect."
 TFRNS_Maghreb_Mauritania_Pressure: "Mauritania Takes A Stand"
 TFRNS_Maghreb_Mauritania_Pressure_DEFAULT_DESC: "Mauritania is pressured into the Maghreb War with a 60% chance, as in vanilla."
 TFRNS_Maghreb_Mauritania_Pressure_Yes_TXT: "Defend Sarhrawi Self-Determination"
 TFRNS_Maghreb_Mauritania_Pressure_Yes_TXT_DESC: "Mauritania is pressured into the Maghreb War and joins Algeria's faction when it breaks out.\n\n§gOnly has an effect if the Maghreb War actually breaks out.§!"
 TFRNS_Maghreb_Mauritania_Pressure_No_TXT: "Don't Rock The Boat"
 TFRNS_Maghreb_Mauritania_Pressure_No_TXT_DESC: "Mauritania keeps out of the Maghreb War and joins no faction."
 TFRNS_Tunisia_2020_elections: "The Tunisian Elections"
 TFRNS_Tunisia_2020_elections_DEFAULT_DESC: "The AI decides the election on its own - Karoui is heavily favoured, as in vanilla."
 TFRNS_Tunisia_2020_elections_1_TXT: "§ONabil Karoui§!"
 TFRNS_Tunisia_2020_elections_1_TXT_DESC: "Pro-Moroccan. Karoui aligns Tunisia with Morocco in the Maghreb War.\n\n§YRequires§! the §YTunisian Crisis§! rule to be set to §YDemocracy Prevails§! - otherwise the government falls and no election is held."
 TFRNS_Tunisia_2020_elections_2_TXT: "§3Youssef Chahed§!"
 TFRNS_Tunisia_2020_elections_2_TXT_DESC: "Neutral. Chahed keeps Tunisia out of the Maghreb War.\n\n§YRequires§! the §YTunisian Crisis§! rule to be set to §YDemocracy Prevails§! - otherwise the government falls and no election is held."
 TFRNS_Tunisia_2020_elections_3_TXT: "§aKais Saied§!"
 TFRNS_Tunisia_2020_elections_3_TXT_DESC: "Pro-Algerian. Saied aligns Tunisia with Algeria in the Maghreb War.\n\n§YRequires§! the §YTunisian Crisis§! rule to be set to §YDemocracy Prevails§! - otherwise the government falls and no election is held.\n\n§gNote: if the crisis rule is set to Democracy Dies in Darkness, Saied takes power that way anyway.§!"

 TFRNS_Maghreb_War_Winner: "Maghreb War Winner"
 TFRNS_Maghreb_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The war plays out as normal."
 TFRNS_Maghreb_War_Winner_MOR_TXT: "§YKingdom of Morocco§!"
 TFRNS_Maghreb_War_Winner_MOR_DESC: "Forces a Moroccan victory in the Maghreb War.\n\n§YMorocco§!, §YSahrawi Arab Democratic Republic§!, and any of §YTunisia§!, §YMauritania§!, §YHouse of Representatives Libya§!, or §YLibya§! that are in the §YMOR_Faction_Name§! faction will receive the §YMushroom Army§! war buff."
 TFRNS_Maghreb_War_Winner_ALG_TXT: "§YIslamic Republic of Algeria§!"
 TFRNS_Maghreb_War_Winner_ALG_DESC: "Forces an Algerian victory in the Maghreb War.\n\n§YAlgeria§!, §YSahrawi Arab Democratic Republic§!, and any of §YTunisia§!, §YMauritania§!, §YHouse of Representatives Libya§!, or §YLibya§! that are in the §YALG_Faction_Name§! faction will receive the §YMushroom Army§! war buff."
 TFRNS_Stalemate_TXT: "§YStalemate§!"
 TFRNS_Maghreb_War_Winner_STALEMATE_DESC: "Applies the People's War state modifier across the territory of Maghreb War participants. The modifier is removed when the Maghreb War ends. No Mushroom Army buff is applied."

 TFRNS_HRL_PostWar_Election: "HRL Post-Civil War Elections"
 TFRNS_HRL_PostWar_Election_DEFAULT_DESC: "Default TFR behaviour. The AI has an even chance between the two candidates."
 TFRNS_HRL_PostWar_Election_Gaddafi_TXT: "§CThe Great Jihad§!"
 TFRNS_HRL_PostWar_Election_Gaddafi_DESC: "§YHRL§! will force §CSaif al-Islam Gaddafi§! to win the upcoming election.\n\n§RWarning:§! This is the path that enables the Gaddafist invasion of Tunisia via §Ylibya.14§! if the Maghreb War allows for it."
 TFRNS_HRL_PostWar_Election_Haftar_TXT: "§3The Enduring Republic§!"
 TFRNS_HRL_PostWar_Election_Haftar_DESC: "§YHRL§! will force §3Khalifa Haftar§! to win the upcoming election.\n\n§RWarning:§! This path sets §YHRL_pro_algeria_global§! and pulls §YHRL§! into Algeria's camp for the Maghreb War."

 TFRNS_LBA_PostWar_Election: "Libyan Post-Civil War Elections"
 TFRNS_LBA_PostWar_Election_DEFAULT_DESC: "Default TFR behaviour. There are two ways the war can end: a §Ystalemate§! (the ceasefire, libya.30) opens a four-way election - Gaddafi, Dbeibeh, Jalil and suspended elections each 25% - while a §YTripoli government victory§! (LBA defeats the Tobruk Government outright, libya.42) opens a two-way choice - Jalil or Abusahmain, each 50%.\n\n§gEach option below only takes effect on the ending it names.§!"
 TFRNS_LBA_PostWar_Election_Gaddafi_TXT: "§dSaif al-Islam Gaddafi§!"
 TFRNS_LBA_PostWar_Election_Gaddafi_DESC: "Forces §dSaif al-Islam Gaddafi§! (Gaddafism - Authoritarian Socialist) to win the election, turning Libya into the Libyan Arab Islamic Republic.\n\n§YRequires the Libyan civil war to end in a stalemate§! (the ceasefire path). If the war instead ends in a §YTripoli government victory§!, this option has no effect and a conservative leader takes power.\n\n§gNote:§! Unlike the §YTobruk Government§! election, this does §Rnot§! set the flag that starts the Gaddafist invasion of Tunisia."
 TFRNS_LBA_PostWar_Election_Dbeibeh_TXT: "§gAbdul Hamid Dbeibeh§!"
 TFRNS_LBA_PostWar_Election_Dbeibeh_DESC: "Forces §gAbdul Hamid Dbeibeh§! (Authoritarian Democratic) to win the election and form the Federal Republic of Libya.\n\n§YRequires the Libyan civil war to end in a stalemate§! (the ceasefire path). If the war instead ends in a §YTripoli government victory§!, this option has no effect.\n\n§RWarning:§! This sets §YHRL_pro_algeria_global§!, aligning Libya with §YAlgeria§! in the §YMaghreb War§! - the §YMaghreb War Winner§! rule and Algeria's fortunes then decide the outcome."
 TFRNS_LBA_PostWar_Election_Jalil_TXT: "§BMostafa Abdul Jalil§!"
 TFRNS_LBA_PostWar_Election_Jalil_DESC: "Forces §BMostafa Abdul Jalil§! (Conservative - Islamic Democracy) to win the election and restore the Kingdom of Libya under the Senussi monarchy.\n\n§gWorks on both endings:§! §Ystalemate§! (ceasefire) and §YTripoli government victory§!.\n\n§RWarning:§! This sets §YLBA_pro_morocco_global§!, aligning Libya with §YMorocco§! in the §YMaghreb War§! - the §YMaghreb War Winner§! rule and Morocco's fortunes then decide the outcome."
 TFRNS_LBA_PostWar_Election_Abusahmain_TXT: "§BNouri Abusahmain§!"
 TFRNS_LBA_PostWar_Election_Abusahmain_DESC: "Forces §BNouri Abusahmain§! (Conservative - Islamic Democracy) to win the election, forming a conservative government without restoring the monarchy.\n\n§YRequires the Libyan civil war to end in a Tripoli government victory§! (LBA defeats the Tobruk Government outright). If the war instead ends in a §Ystalemate§!, this option has no effect and the four-way ceasefire election is held."
 TFRNS_LBA_PostWar_Election_Suspended_TXT: "§YElections Suspended§!"
 TFRNS_LBA_PostWar_Election_Suspended_DESC: "Elections are indefinitely suspended. No new leader takes power and no foreign alignment is set; only the news event fires.\n\n§YRequires the Libyan civil war to end in a stalemate§! (the ceasefire path). If the war instead ends in a §YTripoli government victory§!, this option has no effect."

 TFRNS_HRL_Haftar_Invasion_Outcome: "Haftar's Invasion Outcome"
 TFRNS_HRL_Haftar_Invasion_Outcome_DEFAULT_DESC: "Default TFR behaviour for HRL invasions."
 TFRNS_HRL_Gaddafi_Invasion_Outcome: "Gaddafi's Invasion Outcome"
 TFRNS_HRL_Gaddafi_Invasion_Outcome_DEFAULT_DESC: "Default TFR behaviour for HRL invasions."
 TFRNS_HRL_Invasion_HRL_Wins_TXT: "§YHRL Wins§!"
 TFRNS_HRL_Invasion_Repelled_TXT: "§YInvasion Repelled§!"
 TFRNS_HRL_Haftar_Invasion_Outcome_HRL_Wins_DESC: "Favors HRL through Haftar's Algeria and Morocco invasions. HRL receives the Mushroom Army buff; any target with an existing Mushroom Army buff loses it and its Mushroom Army units. Temporary buffs are cleaned up after the Morocco war and the rest of the invasion chain end."
 TFRNS_HRL_Haftar_Invasion_Outcome_Repelled_DESC: "Favors the defenders through Haftar's Algeria and Morocco invasions. Defenders keep existing Mushroom Army buffs or receive a defensive buff if they lack one. Temporary buffs are cleaned up after the Morocco war and the rest of the invasion chain end."
 TFRNS_HRL_Gaddafi_Invasion_Outcome_HRL_Wins_DESC: "Favors HRL through Gaddafi's Tunisia, Algeria, and Morocco invasions. HRL receives the Mushroom Army buff; any target with an existing Mushroom Army buff loses it and its Mushroom Army units. Temporary buffs are cleaned up after the Morocco war and the rest of the invasion chain end."
 TFRNS_HRL_Gaddafi_Invasion_Outcome_Repelled_DESC: "Favors the defenders through Gaddafi's Tunisia, Algeria, and Morocco invasions. Defenders keep existing Mushroom Army buffs or receive a defensive buff if they lack one. Temporary buffs are cleaned up after the Morocco war and the rest of the invasion chain end."
 TFRNS_Algeria_Civil_War_Winner: "Algerian Civil War Winner"
 TFRNS_Algeria_Civil_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The Algerian Civil War will play out as normal."
 TFRNS_Algeria_Civil_War_Winner_ALG_TXT: "§YAlgerian Interim Government§!"
 TFRNS_Algeria_Civil_War_Winner_ALG_DESC: "The §YAlgerian Interim Government§! (ALG) will be favored to come out on top of the Algerian Civil War."
 TFRNS_Algeria_Civil_War_Winner_AG1_TXT: "§YRepublic of Algeria§!"
 TFRNS_Algeria_Civil_War_Winner_AG1_DESC: "The §YRepublic of Algeria§! (AG1) will be favored to come out on top of the Algerian Civil War."
 TFRNS_Algeria_Civil_War_Winner_AG2_TXT: "§YIslamic Republic of Algeria§!"
 TFRNS_Algeria_Civil_War_Winner_AG2_DESC: "The §YIslamic Republic of Algeria§! (AG2) will be favored to come out on top of the Algerian Civil War."
 TFRNS_Egyptian_Civil_War_Winner: "Egyptian Civil War Winner"
 TFRNS_Egyptian_Civil_War_Winner_DEFAULT_DESC: "Default TFR behavior. The Egyptian Civil War plays out as normal."
 TFRNS_Egyptian_Civil_War_Winner_EGY_TXT: "§YEgypt (EGY)§!"
 TFRNS_Egyptian_Civil_War_Winner_EGY_DESC: "Gives Egypt the Mushroom Army attack buff during the civil war. The buff and its units are cleaned up when fighting between EGY, MUS, and MEK ends."
 TFRNS_Egyptian_Civil_War_Winner_MUS_TXT: "§YMUS§!"
 TFRNS_Egyptian_Civil_War_Winner_MUS_DESC: "Gives MUS the Mushroom Army attack buff during the civil war. The buff and its units are cleaned up when fighting between EGY, MUS, and MEK ends."
 TFRNS_Egyptian_Civil_War_Winner_MEK_TXT: "§YMEK§!"
 TFRNS_Egyptian_Civil_War_Winner_MEK_DESC: "Gives MEK the Mushroom Army attack buff during the civil war. The buff and its units are cleaned up when fighting between EGY, MUS, and MEK ends."

 TFRNS_Indo_Pakistan_Nuclear_Agreement: "Indo-Pakistani Nuclear Agreement"
 TFRNS_Indo_Pakistan_Nuclear_Agreement_DEFAULT_DESC: "Default TFR behavior. China may host negotiations, and India and Pakistan decide separately whether to accept."
 TFRNS_Indo_Pakistan_Nuclear_Agreement_SUCCEEDS_TXT: "§GAgreement Succeeds§!"
 TFRNS_Indo_Pakistan_Nuclear_Agreement_SUCCEEDS_DESC: "Both sides accept China's mediation. Nuclear escalation is blocked from the start of the war, regardless of when the conference fires."
 TFRNS_Indo_Pakistan_Nuclear_Agreement_FAILS_TXT: "§RAgreement Fails§!"
 TFRNS_Indo_Pakistan_Nuclear_Agreement_FAILS_DESC: "China's mediation fails. Neither side receives the no-nukes guarantee, and the capital-fallen nuclear escalation remains possible."
 TFRNS_LBA_HRL_civil_war_STALEMATE_DESC: "Applies the People's War state modifier across Libyan Civil War territory. The modifier is removed when the civil war ends. No Mushroom Army buff is applied."
 The_RAJ_PAK_war_STALEMATE_DESC: "Applies the People's War state modifier across India-Pakistan War territory. The modifier is removed when the war ends. No Mushroom Army buff is applied."
 TFRNS_Libyan_Civil_War_Peoples_War: "People's War"
 TFRNS_Libyan_Civil_War_Peoples_War_desc: "State-level restrictions on movement and combat used to create a stalemate in the Libyan Civil War."
 TFRNS_Maghreb_Peoples_War: "People's War"
 TFRNS_Maghreb_Peoples_War_desc: "State-level restrictions on movement and combat used to create a stalemate in the Maghreb War."
 TFRNS_Indo_Pakistan_Peoples_War: "People's War"
 TFRNS_Indo_Pakistan_Peoples_War_desc: "State-level restrictions on movement and combat used to create a stalemate in the Indo-Pakistani War."
 TFRNS_Third_African_War_Outcome: "Third African War Outcome"
 TFRNS_Third_African_War_Outcome_DEFAULT_DESC: "Default TFR behavior. The Third African War plays out as normal."
 TFRNS_Third_African_War_Outcome_EAP_TXT: "§YEast Africa Pact Victory§!"
 TFRNS_Third_African_War_Outcome_EAP_DESC: "§YEthiopia§! and every nation in Ethiopia's faction receive the Mushroom Army war buff for the duration of the Third African War. Active Mushroom buffs from the Ethiopian, Somali, and Sudanese civil war rules are cleared first."
 TFRNS_Third_African_War_Outcome_NRC_TXT: "§YNile River Coalition Victory§!"
 TFRNS_Third_African_War_Outcome_NRC_DESC: "§YEgypt§! and every nation in Egypt's faction receive the Mushroom Army war buff for the duration of the Third African War. Active Mushroom buffs from the Ethiopian, Somali, and Sudanese civil war rules are cleared first."
 TFRNS_Third_African_War_Outcome_STALEMATE_DESC: "Applies the People's War state modifier to states owned by Ethiopia's and Egypt's factions. The modifier is removed when the Third African War ends. No Mushroom Army buff is applied. Active Mushroom buffs from the Ethiopian, Somali, and Sudanese civil war rules are cleared first."
 TFRNS_Third_African_War_Peoples_War: "People's War"
 TFRNS_Third_African_War_Peoples_War_desc: "State-level restrictions on movement and combat used to create a stalemate in the Third African War."

 TFRNS_Cobasna_Depot_Explosion: "Cobasna Ammunition Depot"
 TFRNS_Cobasna_Depot_Explosion_DEFAULT_DESC: "Default TFR behavior: the depot has a 70% chance to explode during qualifying fighting in Cobasna."
 TFRNS_Cobasna_Depot_Explosion_YES_TXT: "§RDepot Explodes§!"
 TFRNS_Cobasna_Depot_Explosion_YES_DESC: "The depot explodes during the first qualifying battle for state 857."
 TFRNS_Cobasna_Depot_Explosion_NO_TXT: "§GDepot Remains Intact§!"
 TFRNS_Cobasna_Depot_Explosion_NO_DESC: "The depot cannot explode."



 TFRNS_Final_Solution_War_Outcome: "Final Solution War Outcome"
 TFRNS_Final_Solution_War_Outcome_DEFAULT_DESC: "Default TFR behavior. The Aryan Liberation War plays out without a rule-selected Mushroom Army advantage."
 TFRNS_Final_Solution_War_Outcome_ATW_TXT: "§RAtomwaffen Victory§!"
 TFRNS_Final_Solution_War_Outcome_ATW_DESC: "Atomwaffen receives the Mushroom Army attack buff for the duration of the Aryan Liberation War. The buff and units are cleaned up when ATW's war chain ends."
 TFRNS_Final_Solution_War_Outcome_CAN_TXT: "§GCanada's Coalition Victory§!"
 TFRNS_Final_Solution_War_Outcome_CAN_DESC: "Canada and each country that joins its coalition against ATW receive the Mushroom Army attack buff for the duration of the Aryan Liberation War. The buffs and units are cleaned up when ATW's war chain ends."
  TFRNS_Greater_Asian_War_Nuclear_Launches: "Greater Asian War - Nuclear Launches"
  TFRNS_Greater_Asian_War_Nuclear_Launches_DEFAULT_DESC: "Default TFR behavior. All Greater Asian War nuclear launches remain under normal AI/player control."
  TFRNS_Greater_Asian_War_Nuclear_Launches_LAUNCH_TXT: "§RAllow Nuclear Launches§!"
  TFRNS_Greater_Asian_War_Nuclear_Launches_LAUNCH_DESC: "All existing Greater Asian War nuclear launch decisions may fire once their normal greenlight conditions are met: China's final thermonuclear chance, ordinary Chinese tactical strikes (including the God-Emperor duplicates), revanchist purification strikes, Pakistani and Indian tactical strikes, India's final MAD decision, and Japanese retaliation against the Chinese capital."
  TFRNS_Greater_Asian_War_Nuclear_Launches_NO_LAUNCH_TXT: "§GNo Nuclear Launches§!"
  TFRNS_Greater_Asian_War_Nuclear_Launches_NO_LAUNCH_DESC: "Every Greater Asian War nuclear launch decision is locked. The arming chain still runs as normal, but no launch can fire."

  TFRNS_European_Nuclear_Launches: "Europe - Nuclear Launches"
  TFRNS_European_Nuclear_Launches_DEFAULT_DESC: "Default TFR behavior. All European nuclear launches remain under normal AI/player control."
  TFRNS_European_Nuclear_Launches_LAUNCH_TXT: "§RAllow Nuclear Launches§!"
  TFRNS_European_Nuclear_Launches_LAUNCH_DESC: "All existing European nuclear launch paths may fire once their normal greenlight conditions are met: German tactical strikes, French tactical strikes, the Day X apocalypse, Russian tactical strikes (including the goodbye-Moscow suicide strike), and other European nuclear paths. Stockpiles are topped up where a launch requires physical bombs."
  TFRNS_European_Nuclear_Launches_NO_LAUNCH_TXT: "§GNo Nuclear Launches§!"
  TFRNS_European_Nuclear_Launches_NO_LAUNCH_DESC: "Every European nuclear launch path is locked, including the Day X apocalypse. Countries can still nuclearize and activate their arsenals, but no launch can fire."

 TFRNS_Arab_Israeli_War_Outcome: "Arab–Israeli War Outcome"
 TFRNS_Arab_Israeli_War_Outcome_DEFAULT_DESC: "Default TFR behavior. The Arab–Israeli War and Operation Sampson proceed normally."
 TFRNS_Arab_Israeli_War_Outcome_ISR_TXT: "Israeli Victory"
 TFRNS_Arab_Israeli_War_Outcome_ISR_DESC: "Locks Operation Sampson and gives Israel and every member of its faction the defensive Mushroom Army buff for the war."
 TFRNS_Arab_Israeli_War_Outcome_ARAB_TXT: "Arab Victory"
 TFRNS_Arab_Israeli_War_Outcome_ARAB_DESC: "Locks Operation Sampson and gives every nation at war with Israel the Mushroom Army attack buff for the war."
 TFRNS_Arab_Israeli_War_Outcome_STALEMATE_DESC: "Locks Operation Sampson and applies the People's War state modifier to territory on both sides of the war. The modifier is removed when the conflict ends."
 TFRNS_Arab_Israeli_War_Outcome_SAMPSON_TXT: "Operation Sampson"
 TFRNS_Arab_Israeli_War_Outcome_SAMPSON_DESC: "Allows Operation Sampson, raises Israel's nuclear stockpile to at least six bombs, matching the vanilla launch requirement, and gives every nation at war with Israel the Mushroom Army attack buff for the war."

 TFRNS_Arab_Israeli_Peoples_War: "People's War"
 TFRNS_Arab_Israeli_Peoples_War_desc: "State-level restrictions on movement and combat used to create a stalemate in the Arab-Israeli War."

 TFRNS_AFG_TAL_War_Winner: "Afghanistan-Taliban War Winner"
 TFRNS_AFG_TAL_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The Afghanistan-Taliban war plays out as normal."
 TFRNS_AFG_TAL_War_Winner_AFG_TXT: "§YIslamic Republic of Afghanistan§!"
 TFRNS_AFG_TAL_War_Winner_AFG_DESC: "Favours §YAfghanistan§! in its war against the Taliban. Afghanistan receives the §YMushroom Army§! war buff for the duration of the conflict.\n\nThe rule only takes effect after the §Y1 March 2020§! US-Taliban ceasefire and while §YAfghanistan§! and the §YTaliban§! are at war."
 TFRNS_AFG_TAL_War_Winner_TAL_TXT: "§YTaliban§!"
 TFRNS_AFG_TAL_War_Winner_TAL_DESC: "Favours the §YTaliban§! in its war against Afghanistan. The Taliban receives the §YMushroom Army§! war buff for the duration of the conflict.\n\nThe rule only takes effect after the §Y1 March 2020§! US-Taliban ceasefire and while §YAfghanistan§! and the §YTaliban§! are at war."

 TFRNS_Saudi_Russian_Support: "Russian Support - Saudi Civil War"
 TFRNS_Saudi_Russian_Support_DEFAULT_DESC: "Default TFR behaviour. AI Russia chooses freely between the Riyadh government and Hezbollah Al-Hejaz in the 'Question of Chaos in Arabia' event.\n\n§gA human Russia can always choose either option.§!"
 TFRNS_Saudi_Russian_Support_GOV_TXT: "§YSupport the Government§!"
 TFRNS_Saudi_Russian_Support_GOV_DESC: "@SAU AI Russia supports the Riyadh government. It takes the 'Support the Government' option in TFR's proxy.1 event, setting §YSOV_support_saudi_gov_flag§! and unlocking the §YSAU§!-side Russian aid decisions, including Wagner.\n\n§gA human Russia can still choose Hezbollah if it wants.§!"
 TFRNS_Saudi_Russian_Support_HEZ_TXT: "§YSupport Hezbollah§!"
 TFRNS_Saudi_Russian_Support_HEZ_DESC: "@SAR AI Russia supports Hezbollah Al-Hejaz. It takes the 'Support Hezbollah' option in TFR's proxy.1 event, setting §YSOV_support_saudi_hezbollah_flag§! and unlocking the §YSAR§!-side Russian aid decisions.\n\n§gA human Russia can still choose the government if it wants.§!"

 TFRNS_Saudi_French_Support: "French Support - Saudi Civil War"
 TFRNS_Saudi_French_Support_DEFAULT_DESC: "Default TFR behaviour. AI France chooses freely between the Arabian Republic and the Saudi government in france.54.\n\n§gA human France can always choose either option.§!"
 TFRNS_Saudi_French_Support_ARR_TXT: "§YSupport the Arabian Republic§!"
 TFRNS_Saudi_French_Support_ARR_DESC: "@ARR AI France takes the pro-republican option in TFR's france.54 event. It sets §YARR_Support_flag§!, sends equipment to the republic, and unlocks the French republican aid focus.\n\n§gA human France can still choose the Saudi government if it wants.§!"
 TFRNS_Saudi_French_Support_SAU_TXT: "§YSupport the Saudi Government§!"
 TFRNS_Saudi_French_Support_SAU_DESC: "@SAU AI France takes the pro-government option in TFR's france.54 event. It sets §YSAU_Support_flag§!, sends equipment to the government, and unlocks the French government aid focus.\n\n§gA human France can still choose the republic if it wants.§!"

 TFRNS_Saudi_Chinese_Support: "Chinese Support - Saudi Civil War"
 TFRNS_Saudi_Chinese_Support_DEFAULT_DESC: "Default TFR behaviour. All three of TFR's Chinese support AI strategies are active at once, so Chinese support can drift between the government, the princes and the republic. The fixed §YPRC_gambit_in_the_gulf§! focus still helps the princes."
 TFRNS_Saudi_Chinese_Support_SAU_TXT: "§YSupport the Saudi Government§!"
 TFRNS_Saudi_Chinese_Support_SAU_DESC: "@SAU Leaves only TFR's §YPRC_support_SAU§! AI strategy active, so Chinese volunteer and support weighting favours the Riyadh government.\n\n§gThis does not change the fixed focus, which still helps the princes.§!"
 TFRNS_Saudi_Chinese_Support_ROC_TXT: "§YSupport the Princes§!"
 TFRNS_Saudi_Chinese_Support_ROC_DESC: "@ROC Leaves only TFR's §YPRC_support_ROC§! AI strategy active, so Chinese volunteer and support weighting favours the princes.\n\n§gThis matches the fixed §YPRC_gambit_in_the_gulf§! focus.§!"
 TFRNS_Saudi_Chinese_Support_ARR_TXT: "§YSupport the Arabian Republic§!"
 TFRNS_Saudi_Chinese_Support_ARR_DESC: "@ARR Leaves only TFR's §YPRC_support_ARR§! AI strategy active, so Chinese volunteer and support weighting favours the republic.\n\n§gThis does not change the fixed focus, which still helps the princes.§!"

 TFRNS_SAF_Chinese_Support: "Chinese Support - South African Civil War"
 TFRNS_SAF_Chinese_Support_DEFAULT_DESC: "Default TFR behaviour. AI China chooses freely between the Economic Freedom Fighters, the ANC government and the Cape Emergency Government in TFR's §Ychina.117§! event.\n\n§gA human China can always choose any of the three options.§!"
 TFRNS_SAF_Chinese_Support_EFF_TXT: "§DSupport the EFF§!"
 TFRNS_SAF_Chinese_Support_EFF_DESC: "@EFF AI China takes TFR's pro-EFF option in §Ychina.117§!: influence goes to the Economic Freedom Fighters, 2000 infantry equipment is transferred, and Chinese volunteer/support weighting favours §YEFF§!.\n\n§gA human China can still choose another side.§!"
 TFRNS_SAF_Chinese_Support_SWZ_TXT: "§YSupport the ANC Government§!"
 TFRNS_SAF_Chinese_Support_SWZ_DESC: "@SWZ AI China takes TFR's pro-ANC option in §Ychina.117§!: influence goes to the ANC government, 2000 infantry equipment is transferred, and Chinese volunteer/support weighting favours §YSWZ§!.\n\n§gA human China can still choose another side.§!"
 TFRNS_SAF_Chinese_Support_SAF_TXT: "§OSupport the Cape Emergency Government§!"
 TFRNS_SAF_Chinese_Support_SAF_DESC: "@SAF AI China takes TFR's pro-government option in §Ychina.117§!: influence goes to the Cape Emergency Government, 1000 infantry equipment is transferred, and Chinese volunteer/support weighting favours §YSAF§!.\n\n§gA human China can still choose another side.§!"

 TFRNS_SAF_Postwar_Election: "SAF Postwar Election"
 TFRNS_SAF_Postwar_Election_DEFAULT_DESC: "Default TFR behaviour. After a Cape Emergency Government victory, TFR's §Ysaf.5§! postwar election is left to normal event selection.\n\n§gA human SAF can always choose either option.§!"
 TFRNS_SAF_Postwar_Election_MARKET_TXT: "§YMarket Liberal Government§!"
 TFRNS_SAF_Postwar_Election_MARKET_DESC: "AI SAF takes TFR's market-liberal option in §Ysaf.5§!: market liberal becomes the ruling party, market liberal popularity rises, and §YSAF_unified§! is set."
 TFRNS_SAF_Postwar_Election_SOCIAL_TXT: "§GSocial Liberal Government§!"
 TFRNS_SAF_Postwar_Election_SOCIAL_DESC: "AI SAF takes TFR's social-liberal option in §Ysaf.5§!: social liberal becomes the ruling party, social liberal popularity rises, and §YSAF_unified§! is set."

