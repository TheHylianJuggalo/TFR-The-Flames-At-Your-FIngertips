 TFRNS_Russian_Operation_Ultimatums: "@TMS @UZB @AZR @GEO Russian Operation Ultimatums"
 TFRNS_Russian_Operation_Ultimatums_DEFAULT_DESC: "Default TFR behaviour. When Russia completes the Central Asian or Caucasus Military Operation, each target makes its own random roll to fold (become a Russian puppet) or stand firm (Russia declares war): @TMS folds about two thirds of the time, @UZB about 55%, @AZR 50/50 and @GEO about 45%.\n\n§gThe rule only replaces the ultimatums' random rolls - the focuses and the ultimatum events still fire as normal.§!"
 TFRNS_Russian_Operation_Ultimatums_FOLD_TXT: "§YFold§!"
 TFRNS_Russian_Operation_Ultimatums_FOLD_DESC: "@TMS @UZB @AZR @GEO All four targets always fold. When Russia completes the Central Asian Military Operation, Turkmenistan and Uzbekistan become Russian puppets; when it completes the Caucasus Military Operation, Azerbaijan and Georgia do too - no random roll.\n\n§gThe ultimatum events still fire as normal.§!"
 TFRNS_Russian_Operation_Ultimatums_STAND_FIRM_TXT: "§RStand Firm§!"
 TFRNS_Russian_Operation_Ultimatums_STAND_FIRM_DESC: "@TMS @UZB @AZR @GEO All four targets always stand firm. When Russia completes the Central Asian Military Operation, it declares war on Turkmenistan and Uzbekistan; when it completes the Caucasus Military Operation, it declares war on Azerbaijan and Georgia - no random roll.\n\n§gThe ultimatum events still fire as normal.§!"

 TFRNS_French_Regionalist_War_Winner: "French Regionalist War Winner"
 TFRNS_French_Regionalist_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The Volt Europa regionalist war plays out as normal.\n\n§gIn TFR the Volt coup is only reached after Volt Europa's demonstrations in Paris topple the government following the defeat in the east.§!"
 TFRNS_French_Regionalist_War_Winner_FRA_TXT: "§YFrance§!"
 TFRNS_French_Regionalist_War_Winner_FRA_DESC: "@FRA Favours §YLambart's France§! against all eight regional breakaways. France receives the §YMushroom Army§! attack buff while it is still fighting them.\n\n§gThe buff is removed as soon as France capitulates - Germany annexes France and declares war on all eight regionalists.§!"
 TFRNS_French_Regionalist_War_Winner_REGIONS_TXT: "§YAll Regionalists§!"
 TFRNS_French_Regionalist_War_Winner_REGIONS_DESC: "Favours all eight regional breakaways - §YNMD§!, §YSAX§!, §YBRI§!, §YFCM§!, §YPIC§!, §YOCT§!, §YLIM§! and §YPRV§! - against Lambart's France. Every regionalist receives the §YMushroom Army§! attack buff while France is still alive.\n\n§gThe buff is stripped from all eight the moment France dies and Germany takes over the war.§!"


 TFRNS_Eyes_Wide_Shut: "Eyes Wide Shut"
 TFRNS_Eyes_Wide_Shut_DEFAULT_DESC: "Default TFR behaviour. The Countryside Insurgency can be reduced and ended through its normal decisions."
 TFRNS_Eyes_Wide_Shut_GLOW_TXT: "A Glow in The Dark"
 TFRNS_Eyes_Wide_Shut_GLOW_DESC: "The Countryside Insurgency can no longer be quashed. The Combat the Insurgency decisions and the End the Insurgency cleanup are locked, so the insurgency keeps growing until it reaches level 10 and the National Security State route triggers."
BLR_20_election_3_TXT: "Russian Tanks Roll Into Minsk"
BLR_20_election_3_TXT_DESC: "The opposition protests win out, but Lukashenko calls in Russian aid. Russia intervenes, restores Lukashenko, puppetizes Belarus, and the 'Russian Tanks Roll Into Minsk' news fires. Human Russia can still refuse."
 TFRNS_Getting_the_Gang_Back_Together: "Getting the gang back together"
 TFRNS_Getting_the_Gang_Back_Together_DEFAULT_DESC: "Default behaviour. Every invitee answers the communist Soviet Union's invitation using the existing weighting: Belarus follows its current preference, while the Caucasus and Central Asian states use TFR's normal per-country and government modifiers."
 TFRNS_Getting_the_Gang_Back_Together_YES_TXT: "§GYes - Join the USSR§!"
 TFRNS_Getting_the_Gang_Back_Together_YES_DESC: "Every AI invitee - §YBLR§!, §YGEO§!, §YARM§!, §YAZR§!, §YKAZ§!, §YKYR§!, §YTAJ§!, §YUZB§! and §YTMS§! - always accepts the invitation. Each receives §YSOV_peaceful_annexation§! and is integrated peacefully into the Soviet Union when its focus completes.\n\n§gHuman invitees still have both choices.§!"
 TFRNS_Getting_the_Gang_Back_Together_NO_TXT: "§RNo - Reject the USSR§!"
 TFRNS_Getting_the_Gang_Back_Together_NO_DESC: "Every AI invitee - §YBLR§!, §YGEO§!, §YARM§!, §YAZR§!, §YKAZ§!, §YKYR§!, §YTAJ§!, §YUZB§! and §YTMS§! - always declines the invitation. Each receives §YSOV_invasion_target_flag§!, so communist Russia can declare war when its focus completes.\n\n§gHuman invitees still have both choices.§!"

 TFRNS_Myanmar_Civil_War_Winner: "Myanmar Civil War Winner"
 TFRNS_Myanmar_Civil_War_Winner_DEFAULT_DESC: "Default TFR behaviour. The 2021 coup starts the Myanmar civil war with the §YPeople's War§! state modifier, making the war grind until China intervenes."
 TFRNS_Myanmar_Civil_War_Winner_PRC_TXT: "§YChina§!"
 TFRNS_Myanmar_Civil_War_Winner_PRC_DESC: "A presentation-only option. TFR's Chinese intervention path is left untouched, and the civil war still uses the §YPeople's War§! state modifier."
 TFRNS_Myanmar_Civil_War_Winner_BRM_TXT: "§YMyanmar (BRM)§!"
 TFRNS_Myanmar_Civil_War_Winner_BRM_DESC: "The §YPeople's War§! state modifier is stripped from Burmese-core states as soon as the civil war starts, and the §Yjunta§! receives the §YMushroom Army§! attack buff."
 TFRNS_Myanmar_Civil_War_Winner_PDF_TXT: "§YPeople's Defense Force§!"
 TFRNS_Myanmar_Civil_War_Winner_PDF_DESC: "The §YPeople's War§! state modifier is stripped from Burmese-core states as soon as the civil war starts. Every anti-junta faction that rises in the coup - §YPDF§!, §YMND§!, §YKNU§!, §YCNF§! and §YKLA§! - receives the §YMushroom Army§! attack buff."

