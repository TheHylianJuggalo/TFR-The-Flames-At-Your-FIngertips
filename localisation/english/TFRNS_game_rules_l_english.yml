l_english:
 TFRNS_Tunisia_2020_crisis: "The Tunisian Crisis"
 TFRNS_Tunisia_2020_crisis_DEFAULT_DESC: "The AI decides the crisis on its own - even odds of the vote succeeding or failing."
 TFRNS_Tunisia_2020_crisis_1_TXT: "Democracy Prevails"
 TFRNS_Tunisia_2020_crisis_1_TXT_DESC: "The no-confidence vote succeeds and new elections are held.\n\nThe §YTunisian Elections§! rule decides the result - this is the only crisis outcome where that rule takes effect."
 TFRNS_Tunisia_2020_crisis_2_TXT: "Democracy Dies in Darkness"
 TFRNS_Tunisia_2020_crisis_2_TXT_DESC: "The government falls and President Kais Saied consolidates power.\n\n§RNo elections are held§!, so the §YTunisian Elections§! rule has no effect."
 TFRNS_Maghreb_Mauritania_Pressure: "Mauritania Takes A Stand"
 TFRNS_Maghreb_Mauritania_Pressure_DEFAULT_DESC: "Mauritania is pressured into the Maghreb War with a 60% chance, as in vanilla."
 TFRNS_Maghreb_Mauritania_Pressure_Yes_TXT: "Defend Sarhrawi Self-Determination"
 TFRNS_Maghreb_Mauritania_Pressure_Yes_TXT_DESC: "Mauritania is pressured into the Maghreb War and joins Algeria's faction when it breaks out.\n\n§gOnly has an effect if the Maghreb War actually breaks out.§!"
 TFRNS_Maghreb_Mauritania_Pressure_No_TXT: "Don't Rock The Boat"
 TFRNS_Maghreb_Mauritania_Pressure_No_TXT_DESC: "Mauritania keeps out of the Maghreb War and joins no faction."
 TFRNS_Tunisia_2020_elections: "The Tunisian Elections"
 TFRNS_Tunisia_2020_elections_DEFAULT_DESC: "The AI decides the election on its own - Karoui is heavily favoured, as in vanilla."
 TFRNS_Tunisia_2020_elections_1_TXT: "§ONabil Karoui§!"
 TFRNS_Tunisia_2020_elections_1_TXT_DESC: "Pro-Moroccan. Karoui aligns Tunisia with Morocco in the Maghreb War.\n\n§YRequires§! the §YTunisian Crisis§! rule to be set to §YDemocracy Prevails§! - otherwise the government falls and no election is held."
 TFRNS_Tunisia_2020_elections_2_TXT: "§3Youssef Chahed§!"
 TFRNS_Tunisia_2020_elections_2_TXT_DESC: "Neutral. Chahed keeps Tunisia out of the Maghreb War.\n\n§YRequires§! the §YTunisian Crisis§! rule to be set to §YDemocracy Prevails§! - otherwise the government falls and no election is held."
 TFRNS_Tunisia_2020_elections_3_TXT: "§aKais Saied§!"
 TFRNS_Tunisia_2020_elections_3_TXT_DESC: "Pro-Algerian. Saied aligns Tunisia with Algeria in the Maghreb War.\n\n§YRequires§! the §YTunisian Crisis§! rule to be set to §YDemocracy Prevails§! - otherwise the government falls and no election is held.\n\n§gNote: if the crisis rule is set to Democracy Dies in Darkness, Saied takes power that way anyway.§!"
